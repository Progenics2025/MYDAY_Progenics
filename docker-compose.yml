version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: myday-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: myday_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-myday_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d myday_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - myday-network

  # MyDay Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myday-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-myday_secure_password}@db:5432/myday_db
      JWT_SECRET: ${JWT_SECRET:-your-super-secure-jwt-secret-change-this}
      SESSION_SECRET: ${SESSION_SECRET:-your-session-secret-change-this}
      CORS_ORIGIN: https://myday.progenicslabs.com
      # SMTP Configuration (add your values)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - myday-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  myday-network:
    driver: bridge
