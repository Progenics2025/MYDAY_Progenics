# Render.com Blueprint - One-click deployment
# https://render.com/docs/blueprint-spec

services:
  # Web Service
  - type: web
    name: myday-hrms
    runtime: docker
    region: singapore  # Closest to India
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false  # Set manually in dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false  
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
